<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scramjet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #121212; color: #eee; font-family: system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; height: 100%; }
    .bar {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 12px; background: #1e1e1e; border-bottom: 1px solid #333;
    }
    .bar button {
      background: #333; color: #fff; border: 0; border-radius: 6px;
      padding: 8px 12px; cursor: pointer;
    }
    .bar button:hover { background: #444; }
    .bar input {
      flex: 1; background: #121212; color: #fff; border: 1px solid #333;
      border-radius: 6px; padding: 8px 10px;
    }
    #status { font-size: 12px; color: #9aa; white-space: nowrap; }
    #frame { flex: 1; min-height: 0; background: #fff; }
    #frame iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <button id="back" type="button">Back</button>
      <button id="fwd" type="button">Fwd</button>
      <button id="reload" type="button">Reload</button>
      <input id="url" type="text" value="https://example.com" spellcheck="false" />
      <button id="go" type="button">Go</button>
      <span id="status">Loading…</span>
    </div>
    <div id="frame"></div>
  </div>

  <!-- ORDER MATTERS. Classic scripts only. Do not add type="module". -->
  <script src="/testprox/baremux/index.js"></script>
  <script src="/testprox/scramjet/scramjet.all.js"></script>
  <script src="/testprox/app.js"></script>
</body>
</html>
