<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testprox - Scramjet</title>

    <script src="/testprox/baremux/index.js"></script>
    <script src="/testprox/scram/scramjet.all.js"></script>
</head>
<body>
    <input type="text" id="bar" placeholder="https://example.com" autocomplete="off">
    <button id="go">Go</button>

    <iframe
        id="frame"
        title="Proxy"
        style="display:block;width:100%;height:90vh;border:0;margin-top:10px;"
    ></iframe>

    <script>
        const frame = document.getElementById("frame");
        const bar = document.getElementById("bar");
        const go = document.getElementById("go");

        let scramjet;

        async function start() {
            await navigator.serviceWorker.register("/testprox/sw.js", {
                scope: "/testprox/"
            });

            await navigator.serviceWorker.ready;

            const connection = new BareMux.BareMuxConnection(
                "/testprox/baremux/worker.js"
            );

            await connection.setTransport(
                "/testprox/libcurl/index.mjs",
                [{ websocket: "wss://wisp-backend-weyl.onrender.com/" }]
            );

            const { ScramjetController } = $scramjetLoadController();

            scramjet = new ScramjetController({
                files: {
                    all: "/testprox/scram/scramjet.all.js",
                    wasm: "/testprox/scram/scramjet.wasm.wasm",
                    sync: "/testprox/scram/scramjet.sync.js"
                },
                prefix: "/testprox/go/"
            });

            scramjet.init();
        }

        function navigate() {
            let url = bar.value.trim();

            if (!url) return;

            if (!/^https?:\/\//i.test(url)) {
                if (!url.includes(".")) {
                    url = "https://search.brave.com/search?q=" +
                        encodeURIComponent(url);
                } else {
                    url = "https://" + url;
                }
            }

            frame.src = scramjet.encodeUrl(url);
        }

        go.addEventListener("click", navigate);

        bar.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                navigate();
            }
        });

        start().catch((error) => {
            console.error("Testprox startup failed:", error);
        });
    </script>
</body>
</html>
