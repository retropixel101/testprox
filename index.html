<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testprox - Scramjet</title>

    <script src="/testprox/baremux/index.js"></script>
    <script src="/testprox/scram/scramjet.all.js"></script>
</head>

<body>

    <input
        type="text"
        id="bar"
        placeholder="Starting..."
        autocomplete="off"
        disabled
    >

    <button id="go" disabled>Go</button>

    <iframe
        id="frame"
        title="Proxy"
        style="
            display:block;
            width:100%;
            height:90vh;
            border:0;
            margin-top:10px;
        "
    ></iframe>

    <script>
        const frame = document.getElementById("frame");
        const bar = document.getElementById("bar");
        const go = document.getElementById("go");

        let scramjet = null;
        let connection = null;
        let started = false;

        async function start() {
            try {
                console.log("[Testprox] Starting...");

                /*
                 * Register the service worker.
                 */
                console.log("[Testprox] Registering service worker...");

                const registration =
                    await navigator.serviceWorker.register(
                        "/testprox/sw.js",
                        {
                            scope: "/testprox/"
                        }
                    );

                console.log(
                    "[Testprox] Service worker registered:",
                    registration.scope
                );

                /*
                 * Load Scramjet controller.
                 */
                console.log("[Testprox] Creating Scramjet controller...");

                const { ScramjetController } =
                    $scramjetLoadController();

                scramjet = new ScramjetController({
                    files: {
                        all: "/testprox/scram/scramjet.all.js",
                        wasm: "/testprox/scram/scramjet.wasm.wasm",
                        sync: "/testprox/scram/scramjet.sync.js"
                    },

                    prefix: "/testprox/go/"
                });

                /*
                 * IMPORTANT:
                 * Wait for Scramjet's IndexedDB configuration
                 * to actually finish creating.
                 */
                console.log("[Testprox] Initializing Scramjet...");

                await scramjet.init();

                console.log("[Testprox] Scramjet initialized.");

                /*
                 * Make sure a service worker is active.
                 */
                await navigator.serviceWorker.ready;

                console.log("[Testprox] Service worker ready.");

                /*
                 * Initialize BareMux.
                 */
                console.log("[Testprox] Starting BareMux...");

                connection =
                    new BareMux.BareMuxConnection(
                        "/testprox/baremux/worker.js"
                    );

                await connection.setTransport(
                    "/testprox/libcurl/index.mjs",
                    [
                        {
                            websocket:
                                "wss://wisp-backend-weyl.onrender.com/"
                        }
                    ]
                );

                console.log("[Testprox] BareMux transport ready.");

                /*
                 * Everything is finally ready.
                 */
                started = true;

                bar.disabled = false;
                go.disabled = false;

                bar.placeholder = "https://example.com";

                console.log(
                    "%c[Testprox] READY",
                    "font-weight:bold"
                );

            } catch (error) {

                console.error(
                    "[Testprox] Startup failed:",
                    error
                );

                bar.placeholder = "Startup failed";
                go.disabled = true;
                bar.disabled = true;
            }
        }

        function navigate() {

            if (!started || !scramjet) {
                console.warn(
                    "[Testprox] Scramjet is not ready yet."
                );
                return;
            }

            let url = bar.value.trim();

            if (!url) return;

            if (!/^https?:\/\//i.test(url)) {

                if (!url.includes(".")) {

                    url =
                        "https://search.brave.com/search?q=" +
                        encodeURIComponent(url);

                } else {

                    url = "https://" + url;
                }
            }

            console.log(
                "[Testprox] Navigating to:",
                url
            );

            const encoded =
                scramjet.encodeUrl(url);

            console.log(
                "[Testprox] Proxy URL:",
                encoded
            );

            frame.src = encoded;
        }

        go.addEventListener(
            "click",
            navigate
        );

        bar.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {
                    navigate();
                }

            }
        );

        start();

    </script>

</body>
</html>
