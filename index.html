<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scramjet Proxy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0f0f0f; color: #eee; }
    header { padding: 12px 16px; background: #1a1a1a; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
    #url { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 15px; }
    button { padding: 10px 18px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    #frame-container { flex: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    #status { font-size: 13px; color: #888; padding: 0 8px; }
  </style>
</head>
<body>
  <header>
    <input id="url" type="text" placeholder="https://example.com or search term" value="https://example.com" />
    <button id="go">Go</button>
    <span id="status">Loading assets…</span>
  </header>
  <div id="frame-container"></div>

  <!-- Load order matters: BareMux → transport → Scramjet -->
  <script src="/testprox/baremux/index.js"></script> <!-- or the main BareMux browser build your package provides -->
  <script src="/testprox/scramjet/scramjet.all.js"></script>

  <script>
    const WISP_URL = "wss://wisp-backend-weyl.onrender.com"; // your server (trailing slash sometimes required)

    const statusEl = document.getElementById("status");
    const urlInput = document.getElementById("url");
    const goBtn = document.getElementById("go");
    const container = document.getElementById("frame-container");

    let scramjet;
    let connection;
    let frame;

    async function init() {
      try {
        // 1. Register service worker
        if (!("serviceWorker" in navigator)) {
          throw new Error("Service Workers not supported");
        }
        await navigator.serviceWorker.register("/testprox/sw.js")
        await navigator.serviceWorker.ready;
        statusEl.textContent = "SW ready";

        // 2. BareMux connection
        connection = new BareMux.BareMuxConnection("/testprox/baremux/worker.js");

        // 3. Set Epoxy transport → your Wisp server
        await connection.setTransport("/testprox/epoxy/index.mjs", [
          { wisp: WISP_URL }
        ]);
        statusEl.textContent = "Transport ready (Epoxy + Wisp)";

        // 4. Scramjet controller
        const { ScramjetController } = $scramjetLoadController();
        scramjet = new ScramjetController({
          files: {
            wasm: "/testprox/scramjet/scramjet.wasm.wasm",
            all: "/testprox/scramjet/scramjet.all.js",
            sync: "/testprox/scramjet/scramjet.sync.js", // include if the package has it
          },
          // optional: prefix, codec, flags, etc.
        });
        await scramjet.init();
        statusEl.textContent = "Scramjet ready – type a URL and press Go";

        // 5. Create the frame once
        frame = scramjet.createFrame();
        frame.frame.style.width = "100%";
        frame.frame.style.height = "100%";
        frame.frame.style.border = "none";
        container.appendChild(frame.frame);

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Init error: " + err.message;
      }
    }

    function navigate() {
      let raw = urlInput.value.trim();
      if (!raw) return;

      // simple search fallback
      if (!/^https?:\/\//i.test(raw) && !raw.includes(".")) {
        raw = "https://duckduckgo.com/?q=" + encodeURIComponent(raw);
      } else if (!/^https?:\/\//i.test(raw)) {
        raw = "https://" + raw;
      }

      if (frame) {
        frame.go(raw);
        statusEl.textContent = "Loading " + raw;
      }
    }

    goBtn.addEventListener("click", navigate);
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") navigate();
    });

    init();
  </script>
</body>
</html>
